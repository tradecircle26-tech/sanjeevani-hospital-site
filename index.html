<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>संजीवनी मल्टीस्पेशलिटी हॉस्पिटल | आपकी सेहत, हमारी प्राथमिकता</title>
    <!-- Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        :root {
            --primary: #0d9488;      /* Calming Medical Teal */
            --primary-dark: #0f766e;
            --secondary: #0284c7;    /* Trustworthy Blue */
            --bg-light: #f8fafc;     /* Clean Off-White */
            --white: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --emergency: #dc2626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* Top Emergency Bar */
        .top-bar {
            background: var(--text-dark);
            color: var(--white);
            padding: 8px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            flex-wrap: wrap;
        }

        .emergency-badge {
            background: var(--emergency);
            padding: 3px 10px;
            border-radius: 4px;
            font-weight: 600;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        /* Navigation Header */
        header {
            background: var(--white);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 15px rgba(0,0,0,0.06);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            transition: 0.3s;
        }

        nav a:hover {
            color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
            padding: 10px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            display: inline-block;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, #e0f2fe 0%, #ccfbf1 100%);
            padding: 70px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            flex-wrap: wrap;
        }

        .hero-text {
            flex: 1;
            min-width: 300px;
        }

        .hero-text h1 {
            font-size: 2.6rem;
            color: var(--text-dark);
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .hero-text p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        .stats-grid {
            display: flex;
            gap: 25px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: var(--white);
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
        }

        .stat-box h3 {
            color: var(--primary);
            font-size: 1.5rem;
        }

        /* Section Common Styles */
        section {
            padding: 70px 5%;
        }

        .section-title {
            text-align: center;
            margin-bottom: 45px;
        }

        .section-title h2 {
            font-size: 2rem;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .section-title p {
            color: var(--text-muted);
        }

        /* About Section */
        .about-container {
            background: var(--white);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.04);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            align-items: center;
        }

        .about-features {
            list-style: none;
            margin-top: 15px;
        }

        .about-features li {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .about-features i {
            color: var(--primary);
        }

        /* Doctors & Team Section */
        .doctors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .doctor-card {
            background: var(--white);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            text-align: center;
            transition: 0.3s;
            border-top: 4px solid var(--primary);
        }

        .doctor-card:hover {
            transform: translateY(-5px);
        }

        .doctor-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }

        .doctor-info {
            padding: 20px;
        }

        .doctor-info h3 {
            font-size: 1.3rem;
            margin-bottom: 5px;
        }

        .degree {
            color: var(--secondary);
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        .exp-badge {
            display: inline-block;
            background: #ccfbf1;
            color: var(--primary-dark);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        /* Infrastructure Gallery (1 Building + 4 Rooms/Beds) */
        .infra-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .building-photo {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            height: 100%;
            min-height: 400px;
        }

        .interior-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .room-photo {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            height: 210px;
        }

        .building-photo img, .room-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.4s;
        }

        .building-photo:hover img, .room-photo:hover img {
            transform: scale(1.05);
        }

        .photo-label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(15, 23, 42, 0.8);
            color: var(--white);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        /* Schedule & Appointment Section */
        .booking-wrapper {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 40px;
            align-items: start;
        }

        .schedule-card, .appointment-card {
            background: var(--white);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .schedule-table th, .schedule-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.95rem;
        }

        .schedule-table th {
            background: #f1f5f9;
            color: var(--text-dark);
        }

        .status-open {
            color: #16a34a;
            font-weight: 600;
        }

        .status-emerg {
            color: var(--emergency);
            font-weight: 600;
        }

        /* Form Styling */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--primary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
